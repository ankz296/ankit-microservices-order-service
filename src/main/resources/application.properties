spring.application.name=order-service
spring.config.import=${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}

# Advanced persistence topology is intentionally disabled by default.
# When enabled, command traffic should hit shard primaries and query traffic should hit replicas.
order.persistence.advanced-topology.enabled=false
order.persistence.advanced-topology.shard-count=2
order.persistence.advanced-topology.default-shard-id=order-shard-0
